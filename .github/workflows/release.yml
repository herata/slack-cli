name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  upload:
    name: upload-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiki-e/upload-rust-binary-action@d94c2c5e7a35e7d1edd0e6e3b3a4d2d9b94f4f1f # v1.22.1
        with:
          bin: slack-cli
          target: ${{ matrix.target }}
          archive: slack-cli-${{ github.ref_name }}-${{ matrix.target }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    needs: upload
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5083fe46898c414b2475087cc79da59e7da859e8 # v2.1.11
        with:
          install: true
          cache: true
      - run: git cliff --tag ${{ github.ref_name }} --output CHANGELOG.md
      - name: upload CHANGELOG to release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: CHANGELOG.md
