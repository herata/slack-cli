[advisories]
version = 2
yanked = "warn"
# proc-macro-error is pulled in transitively by tabled_derive (tabled crate's
# proc-macro helper). The maintainer is unreachable; upstream `tabled` has not
# yet migrated. Tracked until tabled releases a build-time replacement.
ignore = ["RUSTSEC-2024-0370"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-DFS-2016", "Unicode-3.0", "CC0-1.0", "MPL-2.0", "Zlib",
  # webpki-roots (CA bundle for rustls) — required by reqwest's rustls-tls.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
